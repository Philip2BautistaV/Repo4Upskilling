# release-coordinator.yml
#
# Trigger: Manual only. Release coordinators should not auto-trigger.
# Reads release-config.yml to determine scope, downloads artifacts in order,
# deploys each component with conditional gates.
#
# CHANGES MADE IN THIS PASS:
#   1. Fixed Stage 1 (DeployDataPlatform) condition: it referenced the
#      `stageDependencies` context, which is only valid inside a JOB-level
#      variable expression ($[ ... ]) — not inside a STAGE-level `condition:`.
#      In a stage condition, `stageDependencies` resolves to nothing, so
#      `eq(<empty>, 'True')` silently evaluated to false and the stage was
#      skipped on every run, regardless of the dataplatform.enabled flag in
#      release-config.yml. Switched to the `dependencies` context, which is
#      the correct one for stage-level conditions, and folded the job name
#      into the outputs key as required by that context's syntax:
#        dependencies.<StageName>.outputs['<JobName>.<StepName>.<VarName>']
#   2. Applied the same `dependencies` context fix to the commented-out
#      eq(...) conditions on Stage 2 (AIML) and Stage 3 (WebApp), so they're
#      correct whenever you're ready to uncomment them. They are left
#      commented out / condition: succeeded() for now, since you didn't ask
#      to gate those yet — only the syntax was corrected.
#   3. Left the job-level `stageDependencies` usage in the DebugVariables
#      stage untouched — that one's correct as-is, since it's a job variable
#      expression, not a stage condition.
#
# CHANGES MADE IN THIS PASS (buildNumber auto-pickup):
#   4. Stage 0 (ValidateConfig) now also reads each component's `buildNumber`
#      field from release-config.yml and derives a `downloadMode` per
#      component:
#        - buildNumber is blank/null  -> downloadMode = "latestFromBranch"
#          (unchanged behavior — downloads the newest build on ArtifactBranch)
#        - buildNumber has a value    -> downloadMode = "specific"
#          (that exact build is downloaded instead of the branch's latest)
#      Both values are published as job outputs (<component>_buildNumber,
#      <component>_downloadMode) alongside the existing <component>_enabled
#      outputs, using the same `dependencies.ValidateConfig.outputs[...]`
#      pattern already used for the enabled flags.
#   5. Each deploy stage (DataPlatform/AIML/WebApp) now maps those two new
#      outputs into job-level variables via `$[ dependencies... ]` runtime
#      expressions, and its DownloadPipelineArtifact@2 task uses
#      `buildVersionToDownload: $(downloadMode)` with both `buildId` and
#      `branchName` supplied — the task ignores whichever one doesn't match
#      the selected mode, so no extra conditional YAML is needed.
#
# FLAGGED, NOT CHANGED:
#   - The DataPlatform AzureCLI@2 step's inlineScript still only echoes a
#     message — the `bash .../dataplatform/scripts/deploy.sh --env ...` call
#     from your earlier version is gone. Left as-is in case that's
#     deliberate while you're testing the download/listing steps. Say the
#     word if you want deploy.sh added back in.
#   - Stage 2 (AIML) and Stage 3 (WebApp) still use hardcoded
#     `definition: 44` / `definition: 42` instead of the dynamic
#     $(resources.pipeline.<alias>.pipelineID) pattern Stage 1 uses.
#   - Each stage still points at a different fixed Azure service connection
#     ("Development Environment" / "UAT/Test Environment" / "Production
#     Environment") independent of the ${{ parameters.environment }} value
#     chosen at queue time.
#   - IMPORTANT buildNumber caveat: DownloadPipelineArtifact@2's `buildId`
#     input expects Azure DevOps' internal numeric Run ID (the id in a run's
#     URL, e.g. `.../_build/results?buildId=12345`) — NOT the human-readable
#     build number label (e.g. "20260730.3") that Azure DevOps also calls
#     "Build Number" in its UI. release-config.yml's `buildNumber` value is
#     passed straight through as `buildId` below. If you want to type in the
#     human-readable label instead, this needs an extra resolution step
#     (e.g. `az pipelines runs list --project DBG-ACN --pipeline-ids <id>
#     --query "[?buildNumber=='<value>'].id" -o tsv`) to convert it to a run
#     ID first. Say the word if you'd like that resolution step added.
#
# Editing this file in a YAML-aware editor (VS Code with the Azure Pipelines
# extension, which lints indentation live) before pasting into ADO will help
# avoid indentation drift on future edits.

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: staging
    values:
      - staging
      - production

variables:
- ${{ if eq(parameters.environment, 'production') }}:
  - name: ArtifactBranch
    value: refs/heads/main

- ${{ if eq(parameters.environment, 'staging') }}:
  - name: ArtifactBranch
    value: refs/heads/develop

#  - name: dryRun
#    displayName: "Dry Run (validate only, no deployment)"
#    type: boolean
#    default: false

resources:
  pipelines:
    - pipeline: webapp-ci
      project: DBG-ACN
      source: WebApp-CI
#      branch: $(ArtifactBranch)

    - pipeline: dataplatform-ci
      project: DBG-ACN
      source: DataPlatform-CI
#      branch: $(ArtifactBranch)

    - pipeline: aiml-ci
      project: DBG-ACN
      source: AIML-CI
#      branch: $(ArtifactBranch)

pool:
  vmImage: windows-latest

stages:

# -------------------------------------------------------------------
# Stage 0 - Read Release Configuration
# -------------------------------------------------------------------

- stage: ValidateConfig
  displayName: Read Release Config

  jobs:
    - job: ReadConfig

      steps:
        - checkout: self
          path: coordinator

        - task: PowerShell@2
          name: configOutput
          displayName: Parse release-config.yml

          inputs:
            targetType: inline
            script: |

              if (-not (Get-Module -ListAvailable -Name powershell-yaml)) {
                Install-Module powershell-yaml -Force -Scope CurrentUser
              }

              Import-Module powershell-yaml
              
              $config = Get-Content "$(Pipeline.Workspace)/coordinator/release-config.yml" | ConvertFrom-Yaml

              $dp  = $config.components.dataplatform.enabled
              $ai  = $config.components.aiml.enabled
              $web = $config.components.webapp.enabled

              # Normalize a possibly-null/blank YAML scalar to a plain string.
              function Get-BuildNumberString($value) {
                if ($null -eq $value) { return "" }
                $s = [string]$value
                if ([string]::IsNullOrWhiteSpace($s)) { return "" }
                return $s
              }

              $dpBuild  = Get-BuildNumberString $config.components.dataplatform.buildNumber
              $aiBuild  = Get-BuildNumberString $config.components.aiml.buildNumber
              $webBuild = Get-BuildNumberString $config.components.webapp.buildNumber

              # No buildNumber in release-config.yml -> keep grabbing the latest
              # build on ArtifactBranch. A buildNumber value present -> deploy
              # that exact build instead.
              $dpMode  = if ($dpBuild)  { "specific" } else { "latestFromBranch" }
              $aiMode  = if ($aiBuild)  { "specific" } else { "latestFromBranch" }
              $webMode = if ($webBuild) { "specific" } else { "latestFromBranch" }

              Write-Host "DP=$dp   buildNumber='$dpBuild'   downloadMode=$dpMode"
              Write-Host "AI=$ai   buildNumber='$aiBuild'   downloadMode=$aiMode"
              Write-Host "WEB=$web  buildNumber='$webBuild'  downloadMode=$webMode"

              Write-Host "##vso[task.setvariable variable=dp_enabled;isOutput=true]$($dp.ToString())"
              Write-Host "##vso[task.setvariable variable=ai_enabled;isOutput=true]$($ai.ToString())"
              Write-Host "##vso[task.setvariable variable=web_enabled;isOutput=true]$($web.ToString())"

              Write-Host "##vso[task.setvariable variable=dp_buildNumber;isOutput=true]$dpBuild"
              Write-Host "##vso[task.setvariable variable=ai_buildNumber;isOutput=true]$aiBuild"
              Write-Host "##vso[task.setvariable variable=web_buildNumber;isOutput=true]$webBuild"

              Write-Host "##vso[task.setvariable variable=dp_downloadMode;isOutput=true]$dpMode"
              Write-Host "##vso[task.setvariable variable=ai_downloadMode;isOutput=true]$aiMode"
              Write-Host "##vso[task.setvariable variable=web_downloadMode;isOutput=true]$webMode"

# -------------------------------------------------------------------
# Stage 1 - Data Platform
# -------------------------------------------------------------------

- stage: DeployDataPlatform
  displayName: Deploy DataPlatform

  dependsOn:
    - ValidateConfig

  #condition: eq(stagedependencies.ValidateConfig.ReadConfig.outputs['configOutput.dp_enabled'], 'True')
  condition: and(succeeded(), eq(dependencies.ValidateConfig.outputs['ReadConfig.configOutput.dp_enabled'], 'True'))

  jobs:
    - deployment: DataPlatformDeploy

      environment: ${{ parameters.environment }}

      variables:
        buildNumber: $[ dependencies.ValidateConfig.outputs['ReadConfig.configOutput.dp_buildNumber'] ]
        downloadMode: $[ dependencies.ValidateConfig.outputs['ReadConfig.configOutput.dp_downloadMode'] ]

      strategy:
        runOnce:
          deploy:

            steps:
              - download: none

              - powershell: |
                  Write-Host "Environment = ${{ parameters.environment }}"
                  Write-Host "ArtifactBranch = $(ArtifactBranch)"
                  Write-Host "buildNumber (from release-config.yml) = $(buildNumber)"
                  Write-Host "downloadMode = $(downloadMode)"
                displayName: Debug Branch

              - task: DownloadPipelineArtifact@2
                displayName: Download DataPlatform Artifact
                inputs:
                  buildType: specific
                  project: DBG-ACN
                  definition: 43
                  buildVersionToDownload: $(downloadMode)
                  buildId: $(buildNumber)
                  branchName: $(ArtifactBranch)
                  artifactName: dataplatform-drop
                  targetPath: $(Pipeline.Workspace)/DataPlatform

              - task: AzureWebApp@1
                displayName: Deploy Package to Staging101

#                condition: ne('${{ parameters.dryRun }}','true')

                inputs:
                  azureSubscription: Development Environment
                  appType: webApp
                  appName: Staging101
                  package: '$(Pipeline.Workspace)\DataPlatform\s.zip'

# -------------------------------------------------------------------
# Stage 2 - AIML
# -------------------------------------------------------------------

- stage: DeployAIML
  displayName: Deploy AIML Pipeline

  dependsOn:
    - ValidateConfig
    - DeployDataPlatform

  condition: >
    and(
      eq(
        dependencies.ValidateConfig.outputs['ReadConfig.configOutput.ai_enabled'],
        'True'
      ),
      in(
        dependencies.DeployDataPlatform.result,
        'Succeeded',
        'Skipped'
      )
    )

  jobs:
    - deployment: AIMLDeploy

      environment: ${{ parameters.environment }}

      variables:
        buildNumber: $[ dependencies.ValidateConfig.outputs['ReadConfig.configOutput.ai_buildNumber'] ]
        downloadMode: $[ dependencies.ValidateConfig.outputs['ReadConfig.configOutput.ai_downloadMode'] ]

      strategy:
        runOnce:
          deploy:

            steps:
              - download: none

              - powershell: |
                  Write-Host "Environment = ${{ parameters.environment }}"
                  Write-Host "ArtifactBranch = $(ArtifactBranch)"
                  Write-Host "buildNumber (from release-config.yml) = $(buildNumber)"
                  Write-Host "downloadMode = $(downloadMode)"
                displayName: Debug Branch

              - task: DownloadPipelineArtifact@2
                displayName: Download AIML Artifact
                inputs:
                  buildType: specific
                  project: DBG-ACN
                  definition: 44
                  buildVersionToDownload: $(downloadMode)
                  buildId: $(buildNumber)
                  branchName: $(ArtifactBranch)
                  artifactName: aiml-drop
                  targetPath: $(Pipeline.Workspace)/aiml

              - task: AzureWebApp@1
                displayName: Deploy Package to ORT-Environment

#                condition: ne('${{ parameters.dryRun }}','true')

                inputs:
                  azureSubscription: UAT/Test Environment
                  appType: webApp
                  appName: ORT-Environment
                  package: '$(Pipeline.Workspace)\aiml\s.zip'

# -------------------------------------------------------------------
# Stage 3 - WebApp
# -------------------------------------------------------------------

- stage: DeployWebApp
  displayName: Deploy WebApp (React + API)

  dependsOn:
    - ValidateConfig
    - DeployDataPlatform
    - DeployAIML

  condition: >
    and(
      eq(
        dependencies.ValidateConfig.outputs['ReadConfig.configOutput.web_enabled'],
        'True'
      ),
      in(
        dependencies.DeployDataPlatform.result,
        'Succeeded',
        'Skipped'
      ),
      in(
        dependencies.DeployAIML.result,
        'Succeeded',
        'Skipped'
      )
    )
  
  jobs:
    - deployment: WebAppDeploy

      environment: ${{ parameters.environment }}

      variables:
        buildNumber: $[ dependencies.ValidateConfig.outputs['ReadConfig.configOutput.web_buildNumber'] ]
        downloadMode: $[ dependencies.ValidateConfig.outputs['ReadConfig.configOutput.web_downloadMode'] ]

      strategy:
        runOnce:
          deploy:

            steps:
              - download: none

              - powershell: |
                  Write-Host "Environment = ${{ parameters.environment }}"
                  Write-Host "ArtifactBranch = $(ArtifactBranch)"
                  Write-Host "buildNumber (from release-config.yml) = $(buildNumber)"
                  Write-Host "downloadMode = $(downloadMode)"
                displayName: Debug Branch

              - task: DownloadPipelineArtifact@2
                displayName: Download WebApp Artifact
                inputs:
                  buildType: specific
                  project: DBG-ACN
                  definition: 42
                  buildVersionToDownload: $(downloadMode)
                  buildId: $(buildNumber)
                  branchName: $(ArtifactBranch)
                  artifactName: webapp-drop
                  targetPath: $(Pipeline.Workspace)/webapp

              - task: AzureWebApp@1
                displayName: Deploy React App and API

#                condition: ne('${{ parameters.dryRun }}','true')

                inputs:
                  azureSubscription: Production Environment
                  appType: webApp
                  appName: DBG-Training
                  package: '$(Pipeline.Workspace)\webapp\s.zip'

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO USE THIS FOR EACH RELEASE
# ─────────────────────────────────────────────────────────────────────────────
#
# Release 1 (WebApp only):
#   dataplatform.enabled: false
#   aiml.enabled:         false
#   webapp.enabled:       true
#   Result: Stages 1 and 2 are skipped. Only Stage 3 runs.
#
# Future release (DataPlatform + WebApp):
#   dataplatform.enabled: true
#   aiml.enabled:         false
#   webapp.enabled:       true
#   Result: Stage 1 runs first. Stage 2 is skipped. Stage 3 runs after Stage 1 succeeds.
#
# Future release (all three components):
#   dataplatform.enabled: true
#   aiml.enabled:         true
#   webapp.enabled:       true
#   Result: Stages run in sequence: 1 then 2 then 3. If Stage 1 fails, Stages 2 and 3 are blocked.
#
# AIML configuration-only change (no DB dependency):
#   dataplatform.enabled: false
#   aiml.enabled:         true
#   webapp.enabled:       false
#   Result: Stage 1 is skipped. Stage 2 runs. Stage 3 is skipped.
#
# Pinning a specific build instead of "latest on branch":
#   Leave a component's buildNumber blank        -> its stage downloads the
#                                                    newest build on ArtifactBranch
#                                                    (unchanged default behavior).
#   Set a component's buildNumber, e.g.:
#     webapp:
#       buildNumber: 12345
#   -> WebApp's stage downloads that exact Run ID instead of the branch's
#      latest build. Each component's buildNumber is independent, so you can
#      pin WebApp while leaving DataPlatform/AIML on latestFromBranch, etc.
#   NOTE: buildNumber here must be the Azure DevOps Run ID (the id in the
#   run's URL), not the human-readable "Build Number" label ADO also shows —
#   see the FLAGGED note near the top of this file.
#
# ─────────────────────────────────────────────────────────────────────────────
# NOTES FOR THE DEVOPS ENGINEER IMPLEMENTING THIS
# ─────────────────────────────────────────────────────────────────────────────
#
# 1. Each component CI pipeline (WebApp-CI, DataPlatform-CI, AIML-CI) must publish
#    its artifact using the 'publish' keyword or PublishPipelineArtifact@1 task.
#    The artifact name must match the artifactName in release-config.yml.
#
# 2. The 'environment' resources (staging, uat, production) must be created in
#    ADO Environments before the pipeline runs. Approval gates can be added there.
#
# 3. The powershell-yaml module is used to parse the config file. An alternative
#    is to use a Python script with PyYAML if the agent already has Python available.
#
# 4. For the dryRun parameter, all AzureCLI tasks are conditioned to skip when
#    dryRun is true. This lets the release manager validate the pipeline plan
#    before committing to an actual deployment.
#
# 5. Stage 2 and Stage 3's real gating conditions are currently commented out
#    (both stages run unconditionally via `condition: succeeded()`). Their
#    commented eq(...) blocks now use the correct `dependencies` context —
#    uncomment and replace `condition: succeeded()` with the block above when
#    you're ready to gate AIML/WebApp the same way DataPlatform is gated.
#
# 6. buildNumber support: each stage's `variables:` block pulls buildNumber
#    and downloadMode from Stage 0's outputs at runtime, and the
#    DownloadPipelineArtifact@2 task switches between "specific" (exact
#    build) and "latestFromBranch" purely by which value ReadConfig
#    published — no per-stage conditionals needed. If a future component is
#    added, give it the same buildNumber field in release-config.yml plus
#    the matching dp/ai/web-style outputs and job variables here.
